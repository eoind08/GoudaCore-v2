name: "Ricotta-2.0"

model:
  vocab_size: 32768
  max_seq_len: 4096
  n_layer: 20
  n_embd: 256
  n_head: 4
  n_kv_head: 2
  mlp_hidden: 768
  rope_base: 10000.0
  rms_eps: 1.0e-6
  qk_norm: true
  z_loss: 0.0

data:
  directory: "edu_fineweb10B"
  tokenizer: "alphaedge-ai/Qwen3-1.7B-eng-32768"

train:
  epochs: 1.0
  sequence_length: 2048
  micro_batch_size: 8
  batch_tokens: 131072
  precision: "bfloat16"
  grad_clip: 1.0
  compile: true
  seed: 42

optimizer:
  muon:
    lr: 0.020
    momentum: 0.95
    weight_decay: 0.1
    nesterov: true
    ns_steps: 5
    adjust_lr_fn: "match_rms_adamw"

  adamw:
    lr: 0.00030
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.1

scheduler:
  warmup_fraction: 0.01
  decay_fraction: 0.10
  min_lr_ratio: 0.10

intervals:
  validate_every: 250
  validation_steps: 20
  save_every: 1000
  generate_every: 500

generation:
  prompts:
    - "The capital of France is"
    - "The largest planet in the Solar System is"
    - "In mathematics, the derivative of x squared is"
    - "Photosynthesis is the process by which"
    - "The primary purpose of a central bank is"
    - "The history of mathematics begins"
    - "Artificial intelligence is"
    - "Once upon a time, in a small village"
  max_new_tokens: 64
  temperature: 0.0
  top_k: null

save:
  output_dir: "runs/ricotta-2.0/r1"